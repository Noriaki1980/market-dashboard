name: Update market data

on:
  schedule:
    # UTC表記。平日＋土曜朝（JSTで東京引け後・NY引け後を含む約3時間おき）
    - cron: "17 */3 * * 1-5"
    - cron: "17 0,3 * * 6"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 待ち行列に入った実行でも、起動時点の古いコミットではなく最新の main を取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Fetch
        run: python scripts/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/market.json
            if git diff --cached --quiet; then
              echo "no changes"; exit 0
            fi
            git commit -m "data: update market.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (main moved) -> sync to latest main and re-fetch (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_data.py
          done
          echo "failed to push after 3 attempts"; exit 1
